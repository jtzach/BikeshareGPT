questions:
- id: sem_001
  question: In GBFS, what is the purpose of the auto-discovery file (gbfs.json)?
  choices:
    A: To list all available feeds (endpoints) and their URLs, typically per language.
    B: To provide a complete history of all trips made in the system.
    C: To publish user account and payment information.
    D: To store the static locations of all vehicles for the next 24 hours.
  answer: A
  explanation: gbfs.json is the entry point that advertises which feeds exist and where they live.
- id: sem_002
  question: What does the top-level field `ttl` represent in a GBFS response?
  choices:
    A: The number of stations in the system.
    B: A recommended time-to-live (in seconds) before the consumer refreshes the feed.
    C: A cryptographic signature for the payload.
    D: The total number of bikes available.
  answer: B
  explanation: '`ttl` indicates how long the data can be cached before refreshing.'
- id: sem_003
  question: What does the top-level field `last_updated` represent in a GBFS response?
  choices:
    A: A POSIX/Unix timestamp (seconds) indicating when the feed was last updated.
    B: The station_id of the last station that changed.
    C: A human-readable string like 'yesterday'.
    D: The number of minutes until the next update.
  answer: A
  explanation: '`last_updated` is a Unix timestamp (seconds).'
- id: sem_004
  question: Which GBFS file typically contains static metadata about stations (name, coordinates, capacity)?
  choices:
    A: station_status.json
    B: system_alerts.json
    C: station_information.json
    D: free_bike_status.json
  answer: C
  explanation: station_information is the static station table.
- id: sem_005
  question: Which GBFS file typically contains real-time availability counts (bikes/docks) per station?
  choices:
    A: station_status.json
    B: system_information.json
    C: vehicle_types.json
    D: geofencing_zones.json
  answer: A
  explanation: station_status carries dynamic availability fields.
- id: sem_006
  question: In station_status.json, what does `num_bikes_available` mean?
  choices:
    A: Total bikes owned by the operator across all cities.
    B: Bikes currently available to rent at this station (right now).
    C: Bikes currently reserved (and not rentable) at this station.
    D: The maximum bikes the station can ever hold.
  answer: B
  explanation: It counts currently available bikes at a station.
- id: sem_007
  question: In station_status.json, what does `num_docks_available` mean (for docked systems)?
  choices:
    A: The number of empty docks currently available for returns.
    B: The number of broken docks at the station.
    C: The number of bikes that were rented today.
    D: The station's latitude.
  answer: A
  explanation: Empty docks available for returning a bike.
- id: sem_008
  question: In station_status.json, what does the boolean `is_renting` indicate?
  choices:
    A: Whether the station is physically installed.
    B: Whether the station is currently allowing rentals.
    C: Whether the station supports e-bikes.
    D: Whether the station is open 24/7.
  answer: B
  explanation: is_renting controls rental availability.
- id: sem_009
  question: In station_status.json, what does the boolean `is_returning` indicate?
  choices:
    A: Whether the station is currently allowing returns.
    B: Whether the station is located indoors.
    C: Whether the station appears on the operator website.
    D: Whether the station is reserved for staff.
  answer: A
  explanation: is_returning controls return availability.
- id: sem_010
  question: In station_status.json, what does the boolean `is_installed` indicate?
  choices:
    A: Whether the station is installed and should be considered part of the system.
    B: Whether the station has a mobile app kiosk.
    C: Whether the station is the newest station.
    D: Whether the station has a parking garage.
  answer: A
  explanation: is_installed indicates the station exists/is deployed.
- id: sem_011
  question: Which field is used to join station_information and station_status for station-based GBFS systems?
  choices:
    A: name
    B: station_id
    C: last_updated
    D: ttl
  answer: B
  explanation: station_id is the stable identifier shared by both feeds.
- id: sem_012
  question: Which GBFS feed is used to publish operator/system metadata such as system name and timezone?
  choices:
    A: system_information.json
    B: station_status.json
    C: system_pricing_plans.json
    D: vehicle_status.json
  answer: A
  explanation: system_information provides system-level metadata.
- id: sem_013
  question: 'GBFS is best described as:'
  choices:
    A: A push-based stream protocol that requires WebSockets.
    B: A pull-based set of JSON endpoints describing near real-time system status.
    C: A binary format optimized for embedded devices.
    D: A proprietary schema only usable with the vendor's SDK.
  answer: B
  explanation: GBFS is pull-based and JSON.
- id: sem_014
  question: In GBFS v2.x, which feed name is commonly used for dockless vehicle availability?
  choices:
    A: free_bike_status
    B: station_status
    C: trips
    D: calendar
  answer: A
  explanation: v2.x uses free_bike_status for free-floating bikes/vehicles.
- id: sem_015
  question: In free_bike_status.json (GBFS v2.x), which field is typically the unique identifier for a vehicle?
  choices:
    A: station_id
    B: bike_id
    C: route_id
    D: stop_id
  answer: B
  explanation: Vehicles in free_bike_status typically use bike_id.
- id: sem_016
  question: What is the role of `vehicle_types.json` in GBFS?
  choices:
    A: It lists every single vehicle's real-time GPS trace.
    B: It provides metadata describing vehicle types (e.g., form_factor, propulsion_type).
    C: It provides the complete trip history.
    D: It lists the daily maintenance schedule.
  answer: B
  explanation: vehicle_types describes types, not instances.
- id: sem_017
  question: 'In vehicle_types.json, `form_factor` is best interpreted as:'
  choices:
    A: The shape/class of the vehicle (bike, scooter, car, etc.).
    B: The fare charged per minute.
    C: The station capacity.
    D: The city name.
  answer: A
  explanation: form_factor encodes vehicle class.
- id: sem_018
  question: 'In vehicle_types.json, `propulsion_type` describes:'
  choices:
    A: Whether the vehicle is pedal-only, electric-assist, fully electric, etc.
    B: The operator name.
    C: The docking technology.
    D: The station region.
  answer: A
  explanation: propulsion_type encodes propulsion.
- id: sem_019
  question: Which of the following is TRUE about GBFS language handling in gbfs.json?
  choices:
    A: GBFS supports listing feeds separately per language key.
    B: GBFS only supports English and no other language.
    C: GBFS uses ISO week numbers to select the language.
    D: Language is chosen by GPS coordinates.
  answer: A
  explanation: Auto-discovery uses language keys (often 'en').
- id: sem_020
  question: 'A key difference between GTFS and GBFS is:'
  choices:
    A: GTFS is typically static schedule data; GBFS is near real-time availability/status data.
    B: GBFS is only for trains; GTFS is only for bikes.
    C: GTFS uses JSON; GBFS uses CSV.
    D: GBFS requires paid licensing; GTFS is always proprietary.
  answer: A
  explanation: GTFS schedules vs GBFS real-time status.
- id: sem_021
  question: In station_information.json, which fields usually represent station coordinates?
  choices:
    A: x_coord and y_coord
    B: lat and lon
    C: northing and easting
    D: geo_hash and geo_salt
  answer: B
  explanation: GBFS station_information uses lat/lon.
- id: sem_022
  question: 'In many GBFS feeds, `capacity` in station_information refers to:'
  choices:
    A: The maximum number of docks (or vehicles) the station can hold.
    B: The maximum speed of bikes.
    C: The maximum trip length.
    D: The number of regions in the system.
  answer: A
  explanation: capacity is station capacity.
- id: sem_023
  question: Which statement about `system_pricing_plans.json` is most accurate?
  choices:
    A: It describes pricing plans and fare information (if provided by the operator).
    B: It lists station locations.
    C: It lists vehicle battery levels.
    D: It is required for every GBFS feed.
  answer: A
  explanation: Pricing is optional; when present it describes plans.
- id: sem_024
  question: What is the typical unit of `last_reported` in station_status.json?
  choices:
    A: Unix timestamp in seconds
    B: Unix timestamp in milliseconds
    C: ISO8601 string
    D: Minutes since midnight
  answer: A
  explanation: last_reported is usually Unix time in seconds.
- id: sem_025
  question: What kind of information is MOST appropriate for `system_alerts.json`?
  choices:
    A: Station out of service, system maintenance, service disruptions.
    B: User passwords.
    C: All historical rentals for the last year.
    D: Private GPS traces of users.
  answer: A
  explanation: Alerts publish operational notices.
- id: sem_026
  question: 'GBFS is managed as a community-driven specification by:'
  choices:
    A: MobilityData
    B: The International Monetary Fund
    C: The World Meteorological Organization
    D: The IEEE Standards Association
  answer: A
  explanation: GBFS is managed by MobilityData.
- id: sem_027
  question: Which of the following is a common *required* top-level key in GBFS feed responses?
  choices:
    A: data
    B: trips
    C: routes
    D: agency
  answer: A
  explanation: Most GBFS feeds have a top-level data object.
- id: sem_028
  question: In gbfs.json, each advertised feed typically has which two fields?
  choices:
    A: route_id and stop_id
    B: name and url
    C: agency_name and fare_url
    D: city and country
  answer: B
  explanation: Feeds are listed as {name, url} pairs.
- id: sem_029
  question: 'If a station has is_renting = 0, then:'
  choices:
    A: Bikes cannot be rented from that station right now.
    B: The station has no GPS.
    C: The station is guaranteed to have zero bikes.
    D: The station must be removed from station_information.
  answer: A
  explanation: is_renting controls rental availability, independent of counts.
- id: sem_030
  question: 'If a station has num_bikes_available = 0, then:'
  choices:
    A: No bikes are currently available to rent at that station (at that moment).
    B: The station is permanently closed.
    C: The station is not installed.
    D: The station does not exist in station_information.
  answer: A
  explanation: Count is momentary availability, not permanence.
- id: sem_031
  question: Which feed would you use to learn the system's official website URL (if provided)?
  choices:
    A: system_information.json
    B: station_status.json
    C: free_bike_status.json
    D: station_information.json
  answer: A
  explanation: system_information typically includes url/name/timezone.
- id: sem_032
  question: Which of the following is a reasonable *consumer* behavior given GBFS `ttl`?
  choices:
    A: Cache the response for at least ttl seconds, then refresh.
    B: Never refresh; GBFS is static.
    C: Refresh only once per month.
    D: Refresh only if the user enters a password.
  answer: A
  explanation: ttl is a caching guideline.
- id: sem_033
  question: Which GBFS feed would you inspect to find a station's latitude and longitude?
  choices:
    A: station_information.json
    B: station_status.json
    C: system_pricing_plans.json
    D: vehicle_types.json
  answer: A
  explanation: Station coordinates are static station metadata.
- id: sem_034
  question: Which GBFS feed would you inspect to find a station's current number of bikes and docks?
  choices:
    A: system_information.json
    B: station_status.json
    C: free_bike_status.json
    D: system_regions.json
  answer: B
  explanation: Dynamic availability lives in station_status.
- id: sem_035
  question: Which field in station_information.json usually tells you whether a station is virtual rather than physically docked?
  choices:
    A: is_virtual_station
    B: is_renting
    C: rider_capacity
    D: last_updated
  answer: A
  explanation: is_virtual_station marks virtual stations.
- id: sem_036
  question: What does `capacity` in station_information.json usually refer to for a station-based system?
  choices:
    A: The number of trips served yesterday
    B: The nominal number of parking positions or docks at the station
    C: The number of operators managing the station
    D: The number of users currently in the app
  answer: B
  explanation: Capacity is the station's nominal size.
- id: sem_037
  question: If a client wants to know the human-readable system name, which feed is the best source?
  choices:
    A: system_information.json
    B: station_status.json
    C: free_bike_status.json
    D: system_hours.json
  answer: A
  explanation: System metadata is stored in system_information.
- id: sem_038
  question: Which GBFS feed is the best place to discover the system's timezone?
  choices:
    A: vehicle_types.json
    B: system_information.json
    C: station_information.json
    D: system_regions.json
  answer: B
  explanation: The timezone is a system-level metadata field.
- id: sem_039
  question: Which field in system_information.json identifies the system itself?
  choices:
    A: region_id
    B: vehicle_type_id
    C: system_id
    D: bike_id
  answer: C
  explanation: system_id names the system.
- id: sem_040
  question: Which feed is most likely to include `plan_id`, `currency`, and `price` fields?
  choices:
    A: system_pricing_plans.json
    B: station_status.json
    C: gbfs.json
    D: system_regions.json
  answer: A
  explanation: Pricing plans are published in system_pricing_plans.
- id: sem_041
  question: Which feed is most likely to include opening hours or allowed rental time windows?
  choices:
    A: system_hours.json
    B: vehicle_types.json
    C: station_information.json
    D: system_alerts.json
  answer: A
  explanation: Rental hours belong in system_hours.
- id: sem_042
  question: What does `region_id` usually do in station_information.json?
  choices:
    A: It joins a station to a system region definition
    B: It encodes the station's pricing plan
    C: It stores the battery level of each bike
    D: It is the same thing as bike_id
  answer: A
  explanation: region_id links stations to regions.
- id: sem_043
  question: If you want the display name of a vehicle type such as an e-bike class, which feed should you query?
  choices:
    A: vehicle_types.json
    B: station_status.json
    C: system_regions.json
    D: system_hours.json
  answer: A
  explanation: vehicle_types describes type metadata.
- id: sem_044
  question: What does `vehicle_type_id` generally do in GBFS?
  choices:
    A: It identifies a pricing plan
    B: It links a vehicle instance or availability record to type metadata
    C: It joins station_information to station_status
    D: It stores the city name
  answer: B
  explanation: vehicle_type_id references a type definition.
- id: sem_045
  question: Which statement about `bike_id` in free_bike_status.json is most accurate?
  choices:
    A: It is a per-vehicle unique identifier
    B: It is always equal to station_id
    C: It is the system timezone
    D: It is the number of bikes available at a station
  answer: A
  explanation: bike_id identifies an individual vehicle record.
- id: sem_046
  question: In free_bike_status.json, what do `lat` and `lon` represent?
  choices:
    A: The system headquarters
    B: The current approximate position of the vehicle
    C: The origin and destination of the last trip
    D: The station capacity
  answer: B
  explanation: lat/lon record vehicle position.
- id: sem_047
  question: Which file best describes whether a vehicle type is human-powered or electric-assist?
  choices:
    A: vehicle_types.json
    B: system_information.json
    C: station_status.json
    D: system_regions.json
  answer: A
  explanation: propulsion_type is a type-level field.
- id: sem_048
  question: Which field in vehicle_types.json is used to describe whether a type is a bicycle or a cargo bicycle?
  choices:
    A: form_factor
    B: operator
    C: ttl
    D: region_id
  answer: A
  explanation: form_factor encodes the class of vehicle.
- id: sem_049
  question: Which field in vehicle_types.json describes how many riders a vehicle type is meant to carry?
  choices:
    A: rider_capacity
    B: num_docks_available
    C: license_id
    D: last_reported
  answer: A
  explanation: rider_capacity is the vehicle type's rider count.
- id: sem_050
  question: Which field in vehicle_types.json may describe the nominal electric range of a vehicle type?
  choices:
    A: max_range_meters
    B: short_name
    C: is_returning
    D: feed_contact_email
  answer: A
  explanation: max_range_meters is the range field.
- id: sem_051
  question: If a consumer wants all feed names and URLs for English, where should it look first?
  choices:
    A: The `en` language block inside gbfs.json
    B: station_information.json
    C: system_hours.json
    D: vehicle_types.json
  answer: A
  explanation: gbfs.json advertises language-specific feed URLs.
- id: sem_052
  question: What does the response field `version` usually identify in GBFS?
  choices:
    A: The GBFS schema version of the payload
    B: The app version installed by the user
    C: The version of pandas needed to read the file
    D: The firmware version of each bike
  answer: A
  explanation: version tells clients which GBFS spec version the payload uses.
- id: sem_053
  question: Which statement about GBFS is correct?
  choices:
    A: GBFS usually exposes multiple JSON endpoints instead of one monolithic file
    B: GBFS is a binary format only readable by native apps
    C: GBFS requires user login to read any endpoint
    D: GBFS is designed to store only historical trip trajectories
  answer: A
  explanation: GBFS is a collection of related JSON feeds.
- id: sem_054
  question: What is the best interpretation of `last_reported` in station_status.json?
  choices:
    A: The last time that specific station status record was updated
    B: The day the station was built
    C: The number of seconds until the next bike rental
    D: The station's region name
  answer: A
  explanation: last_reported is station-record freshness.
- id: sem_055
  question: If `is_renting` is false for a station, what should a consumer generally conclude?
  choices:
    A: The station is currently not offering rentals
    B: The station has no coordinates
    C: The station has been deleted from the system forever
    D: The feed is invalid
  answer: A
  explanation: is_renting is the current rental availability flag.
- id: sem_056
  question: If `is_returning` is false for a station, what should a consumer generally conclude?
  choices:
    A: Returns are currently not allowed there
    B: The station has no docks at all
    C: The station must be virtual
    D: The system has no pricing plan
  answer: A
  explanation: is_returning indicates return availability.
- id: sem_057
  question: If `is_installed` is false for a station, which interpretation is usually most appropriate?
  choices:
    A: The station should not be treated as an active installed station
    B: The station is fully booked
    C: The operator has changed pricing
    D: The system is offline
  answer: A
  explanation: Not installed means not physically in service as installed.
- id: sem_058
  question: Which of the following is typically static rather than real-time?
  choices:
    A: station_information.json
    B: station_status.json
    C: free_bike_status.json
    D: vehicle_status.json
  answer: A
  explanation: station_information is the static station table.
- id: sem_059
  question: Which of the following is typically real-time rather than static?
  choices:
    A: station_status.json
    B: system_information.json
    C: vehicle_types.json
    D: system_regions.json
  answer: A
  explanation: station_status updates frequently.
- id: sem_060
  question: Which field is most useful for opening a deep link to a station in a mobile app or web page?
  choices:
    A: rental_uris
    B: ttl
    C: region_id
    D: max_range_meters
  answer: A
  explanation: rental_uris stores platform-specific links.
- id: sem_061
  question: What does the `currency` field in a pricing plan represent?
  choices:
    A: The ISO currency used for that plan's prices
    B: The system timezone
    C: The number of currencies the operator supports
    D: The station's battery voltage
  answer: A
  explanation: currency names the pricing currency.
- id: sem_062
  question: What does the `price` field in a pricing plan usually represent?
  choices:
    A: The plan's stated monetary amount in the given currency
    B: The number of bikes at the station
    C: The number of pricing plans in the system
    D: The length of the most recent trip
  answer: A
  explanation: price is the monetary amount for the plan.
- id: sem_063
  question: In system_hours.json, what do `start_time` and `end_time` typically describe?
  choices:
    A: The rental window for the specified days and user types
    B: The start and end station IDs
    C: The life span of the GBFS spec
    D: The bike's battery charge cycle
  answer: A
  explanation: system_hours defines rental windows.
- id: sem_064
  question: What do `user_types` in system_hours.json usually indicate?
  choices:
    A: Which categories of users the stated rental hours apply to
    B: Which app version is required
    C: Which stations are virtual
    D: Which bike type is cargo
  answer: A
  explanation: user_types scope the hours.
- id: sem_065
  question: What is a good reason to include `free_bike_status.json` in a benchmark even for a mostly station-based system?
  choices:
    A: It expands evaluation to individual vehicle-level queries
    B: It replaces the need for station_information.json
    C: It stores user account balances
    D: It is required to read system_information.json
  answer: A
  explanation: free_bike_status enables vehicle-level questions.
- id: sem_066
  question: Which statement about `short_name` is most accurate?
  choices:
    A: It is usually a compact human-facing station code, not necessarily the join key
    B: It always replaces station_id in every feed
    C: It is the same as vehicle_type_id
    D: It stores the operator's legal name
  answer: A
  explanation: short_name is often human-facing and separate from station_id.
- id: sem_067
  question: What is the best reason to join station_information.json with station_status.json?
  choices:
    A: To combine station metadata with live availability for analysis
    B: To compute the OpenAI API key
    C: To convert JSON into XML
    D: To recover deleted trips
  answer: A
  explanation: The join gives both station attributes and real-time counts.
- id: sem_068
  question: Which field is most appropriate for joining free_bike_status rows to vehicle type metadata?
  choices:
    A: vehicle_type_id
    B: system_id
    C: license_id
    D: ttl
  answer: A
  explanation: vehicle_type_id links vehicle instances to type metadata.
- id: sem_069
  question: Which of these is NOT typically stored in GBFS?
  choices:
    A: A user's private password
    B: Station capacity
    C: Vehicle type metadata
    D: System timezone
  answer: A
  explanation: GBFS does not publish private user credentials.
- id: sem_070
  question: Which field in system_information.json most directly names the operating organization?
  choices:
    A: operator
    B: ttl
    C: lat
    D: bike_id
  answer: A
  explanation: operator is the operating organization.
- id: sem_071
  question: Which field in system_information.json is best for reporting a support contact email for the feed itself?
  choices:
    A: feed_contact_email
    B: station_id
    C: price
    D: region_id
  answer: A
  explanation: feed_contact_email is intended for feed support contact.
- id: sem_072
  question: Which field in system_information.json is best for contacting the operator more generally?
  choices:
    A: email
    B: capacity
    C: last_reported
    D: vehicle_type_id
  answer: A
  explanation: email is a system contact field.
- id: sem_073
  question: Which field in system_information.json typically gives a telephone support number?
  choices:
    A: phone_number
    B: currency
    C: is_installed
    D: form_factor
  answer: A
  explanation: phone_number is the phone contact.
- id: sem_074
  question: What is the main role of `system_regions.json`?
  choices:
    A: To define named regions that stations can reference
    B: To list all free-bike IDs
    C: To publish every ride taken last month
    D: To define the model's prompt template
  answer: A
  explanation: system_regions maps region IDs to names.
- id: sem_075
  question: What is the main role of `vehicle_image` in vehicle_types.json?
  choices:
    A: To provide an image representing the vehicle type
    B: To store the current GPS coordinates of each vehicle
    C: To provide the station map tiles
    D: To store the benchmark confusion matrix
  answer: A
  explanation: vehicle_image is a representative type image.
- id: sem_076
  question: If a station-based system exposes `num_docks_available`, what kind of analysis becomes possible?
  choices:
    A: Dock occupancy and return availability analysis
    B: User password auditing
    C: Firmware flashing
    D: Weather forecasting
  answer: A
  explanation: Docks enable occupancy analysis.
- id: sem_077
  question: Which statement about GBFS consumers is most accurate?
  choices:
    A: They usually poll feeds periodically and honor the recommended ttl
    B: They must wait for email attachments from the operator
    C: They can ignore last_updated because freshness never matters
    D: They must always use SOAP rather than HTTP
  answer: A
  explanation: GBFS is commonly polled, with ttl as guidance.
- id: sem_078
  question: Which field would you use to identify the pricing plan being referenced?
  choices:
    A: plan_id
    B: station_id
    C: bike_id
    D: region_id
  answer: A
  explanation: plan_id identifies a pricing plan.
